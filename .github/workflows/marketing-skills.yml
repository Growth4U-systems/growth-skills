name: Marketing skills

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/gro-*'

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline content, domain and installer regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: README installation commands in isolated destination
        env:
          DESTINATION: ${{ runner.temp }}/growthskills-${{ matrix.python }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/install_local.py --destination "$DESTINATION" --all-marketing
          test ! -e "$DESTINATION"
          python tools/install_local.py --destination "$DESTINATION" --all-marketing --apply
          git diff --exit-code
